name: Debug BFH HTML (temporaer)

on:
  push:
    branches: [claude/busy-mccarthy-4bge9f]
    paths: [.github/workflows/debug_bfh_html.yml, fetch_bfh.py]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Parser gegen echte Seiten testen (ohne OpenAI)
        shell: python
        run: |
          import os, sys, feedparser, requests
          sys.path.insert(0, os.getcwd())
          from bs4 import BeautifulSoup
          import fetch_bfh as fb
          from generate_weekly_report import create_weekly_pdf
          feed = feedparser.parse(requests.get("https://www.bundesfinanzhof.de/de/precedent.rss", headers=fb.HEADERS, timeout=30).content)
          items = []
          for e in feed.entries:
              d = fb.fetch_decision(e.link)
              topic = fb.clean_text(BeautifulSoup(e.get("summary", ""), "html.parser").get_text(" ")) or d["topic"]
              title = fb.title_with_case_number(e.title, d["text"])
              title = f"{title}: {topic}" if topic and topic not in title else title
              print(f"\n=== {title}")
              print(f"source={d['source']} chars={len(d['text'])} decision={d['decision']!r}")
              print(f"LEITSATZ ({len(d['leitsatz'])}): {d['leitsatz'][:300]!r}")
              print(f"TEXT END: {d['text'][-200:]!r}")
              items.append({"title": title, "published": e.get("published", ""), "link": e.link,
                            "decision": d["decision"], "leitsatz": d["leitsatz"],
                            "summary": f"(Testlauf ohne KI, Volltext {len(d['text'])} Zeichen aus {d['source']})"})
          os.makedirs("out", exist_ok=True)
          create_weekly_pdf(items, "out/Testbericht_ohne_KI.pdf", [], cost=None)
      - uses: actions/upload-artifact@v4
        with:
          name: testbericht
          path: out/Testbericht_ohne_KI.pdf
