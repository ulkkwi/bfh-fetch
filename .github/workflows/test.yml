name: Run Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run logic tests
        run: python tests/test_fetch_bfh.py

      - name: Run PDF generation test
        run: python tests/test_generate_weekly_report.py

      - name: Upload generated PDF
        uses: actions/upload-artifact@v4
        with:
          name: test-pdf
          path: tests/test_weekly_report_*.pdf
          if-no-files-found: error
